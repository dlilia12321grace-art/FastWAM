# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_rollout_video: true
  save_action_trace: false
  profile_timing: false
  analyze_c3cache_residuals: false
  enable_c3cache: false
  c3cache_start_step: 0
  c3cache_end_step: 6
  c3cache_refresh_interval: 4

  # Internal LoRA / ActionGap inference
  enable_internal_lora_branch: false
  internal_lora_checkpoint: null
  # Final shallow ActionGap branch: shared layers 1-4 + copied layer 30.
  internal_lora_fork_layer: 4
  internal_lora_source_start_layer: 30
  internal_lora_source_end_layer: 30
  internal_lora_rank: 8
  internal_lora_alpha: 16.0
  internal_lora_inference_steps: [0]
  internal_lora_merge_for_inference: true
  enable_action_gap_schedule: false
  action_gap: 2

  # Learned Dynamic ActionGap routing
  enable_dynamic_action_gap: false
  dynamic_action_gap_checkpoint: null
  dynamic_action_gap_threshold: null
  dynamic_action_gap_max_internal_run: 3
  dynamic_action_gap_anchor_action_gap: null
  enable_oracle_action_gap: false
  oracle_action_gap_threshold: 0.36
  compute_matched_action_gap_mode: null
  compute_matched_action_gap_target_internal_ratio: 0.65
  compute_matched_action_gap_seed: 0
  collect_dynamic_action_gap_data: false

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
